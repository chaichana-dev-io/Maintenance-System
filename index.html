<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งซ่อม | เจริญกรุงคอนโดมิเนียม 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
      --primary-blue: #1800ad;
      --deep-blue: #0c005a;
      --gold-primary: #d4af37;
      --gold-light: #f1e3a0;
      --glass-bg: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at center, var(--primary-blue) 0%, var(--deep-blue) 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 1s ease-out;
      z-index: 10;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container img {
      max-width: 280px;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
      margin-bottom: 20px;
    }

    .system-title {
      font-size: 1.6rem;
      color: var(--gold-light);
      margin-bottom: 30px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .form-control-lg {
      background: var(--glass-bg);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: white;
      border-radius: 12px;
      padding: 12px 20px;
      transition: 0.3s;
    }
    .form-control-lg:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      color: white;
    }
    .form-label { color: var(--gold-primary); font-size: 0.85rem; margin-bottom: 8px; margin-left: 5px; text-align: left; display: block; }

    .btn-login {
      background: linear-gradient(135deg, #d4af37 0%, #b8962c 100%);
      border: none;
      color: var(--deep-blue);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
      letter-spacing: 2px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); color: var(--deep-blue); }

    #loader-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(12, 0, 90, 0.85);
      backdrop-filter: blur(5px);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner-gold {
      width: 60px; height: 60px;
      border: 5px solid rgba(212, 175, 55, 0.2);
      border-top: 5px solid var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #welcome-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      align-items: center; justify-content: center;
    }
    .popup-content {
      background: linear-gradient(145deg, var(--deep-blue), #1a004d);
      border: 2px solid var(--gold-primary);
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      transform: scale(0.8);
      opacity: 0;
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .popup-content.show { transform: scale(1); opacity: 1; }
    .popup-title { color: var(--gold-light); font-size: 1.8rem; margin-bottom: 10px; }
    .popup-name { color: white; font-size: 1.2rem; margin-bottom: 25px; font-weight: 300; }
    .btn-confirm {
      background: var(--gold-primary);
      color: var(--deep-blue);
      border: none;
      padding: 10px 40px;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-confirm:hover { background: var(--gold-light); transform: scale(1.05); }

    .footer { position: fixed; bottom: 20px; color: rgba(255,255,255,0.3); font-size: 0.75rem; }
  </style>
</head>
<body>

  <div id="loader-overlay">
    <div class="spinner-gold mb-3"></div>
    <div style="color: var(--gold-light); letter-spacing: 2px;">กำลังประมวลผล...</div>
  </div>

  <div id="welcome-popup">
    <div class="popup-content" id="popup-inner">
      <div class="mb-3">
        <img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" width="120" alt="Logo">
      </div>
      <div class="popup-title">ยินดีต้อนรับ</div>
      <div class="popup-name">คุณ <span id="user-display-name"></span></div>
      <div class="text-white-50 mb-4" style="font-weight: 300;">เข้าสู่ระบบแจ้งซ่อมสำเร็จ</div>
      <button class="btn-confirm" id="btn-start">เริ่มต้นใช้งาน</button>
    </div>
  </div>

  <div id="login-page" class="login-wrapper">
    <div class="logo-container">
      <img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" alt="Logo">
    </div>
    <div class="system-title">ระบบจัดการงานซ่อม</div>
    
    <form id="loginForm" autocomplete="off">
      <div class="mb-3 text-start">
        <label class="form-label">USERNAME</label>
        <input type="text" id="userInput" class="form-control form-control-lg" placeholder="ระบุชื่อผู้ใช้งาน" required autocomplete="one-time-code" spellcheck="false">
      </div>
      <div class="mb-4 text-start">
        <label class="form-label">PASSWORD</label>
        <input type="password" id="passInput" class="form-control form-control-lg" placeholder="ระบุรหัสผ่าน" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
    </form>
  </div>

  <footer class="footer">
    © 2026 Charoen Krung Condominium 3 | บริหารจัดการโดยนิติบุคคล
  </footer>

  <script>
    // *** URL ของ Web App อัปเดตล่าสุด ***
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxz62x5nRBboqcC2u1v0BS7uXDbsvFw5XQO0rv1Y4VdqQzvp4M4z7xGJ9xg8yxr6tqLBQ/exec";

    const loginForm = document.getElementById('loginForm');
    const loader = document.getElementById('loader-overlay');
    const welcomePopup = document.getElementById('welcome-popup');
    const popupInner = document.getElementById('popup-inner');
    const userDisplayName = document.getElementById('user-display-name');
    const btnStart = document.getElementById('btn-start');

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      loader.style.display = 'flex'; 

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "checkLogin",
            username: document.getElementById('userInput').value,
            password: document.getElementById('passInput').value
          })
        });

        const result = await response.json();

        if (result.success) {
          loader.style.display = 'none';

          // 1. บันทึกข้อมูลลง localStorage เพื่อให้หน้าอื่นดึงไปใช้ได้ (แก้ปัญหา Login ซ้อน)
          localStorage.setItem('ck3_user', JSON.stringify({
            full_name: result.full_name,
            role: result.role,
            user_id: result.user_id
          }));

          userDisplayName.innerText = result.full_name;
          welcomePopup.style.display = 'flex';
          setTimeout(() => popupInner.classList.add('show'), 10);

          // 2. เมื่อกดปุ่ม ให้ย้ายหน้าไปยังไฟล์ .html จริงบน GitHub
          btnStart.onclick = () => {
            welcomePopup.style.display = 'none';
            const role = result.role.toLowerCase();
            
            if (role === 'admin' || role === 'super_admin') {
              window.location.href = "admin.html";
            } else if (role === 'technician') {
              window.location.href = "tech.html";
            } else {
              window.location.href = "resident.html";
            }
          };
        } else {
          loader.style.display = 'none';
          alert(result.message);
        }
      } catch (err) {
        loader.style.display = 'none';
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
      }
    };
  </script>
</body>
</html>
