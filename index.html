<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งซ่อม | เจริญกรุงคอนโดมิเนียม 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --primary-blue: #1800ad; --deep-blue: #0c005a; --gold-primary: #d4af37; --gold-light: #f1e3a0; --glass-bg: rgba(255, 255, 255, 0.1); }
    body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at center, var(--primary-blue) 0%, var(--deep-blue) 100%); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .login-wrapper { width: 100%; max-width: 380px; text-align: center; z-index: 10; }
    .logo-container img { max-width: 250px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); margin-bottom: 20px; }
    .system-title { font-size: 1.5rem; color: var(--gold-light); margin-bottom: 30px; letter-spacing: 1px; }
    .form-control-lg { background: var(--glass-bg); border: 1px solid rgba(212, 175, 55, 0.3); color: white; border-radius: 12px; }
    .form-control-lg:focus { background: rgba(255, 255, 255, 0.15); border-color: var(--gold-primary); color: white; box-shadow: none; }
    .btn-login { background: linear-gradient(135deg, #d4af37 0%, #b8962c 100%); border: none; color: var(--deep-blue); padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; margin-top: 10px; transition: 0.3s; }
    .btn-login:disabled { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
    .modal-overlay.show { opacity: 1; display: flex; }
    .modal-card { background: linear-gradient(145deg, var(--deep-blue), #1a004d); border: 2px solid var(--gold-primary); border-radius: 30px; padding: 40px; text-align: center; max-width: 350px; width: 90%; transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .modal-overlay.show .modal-card { transform: scale(1); }
    .modal-icon { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; }
    .modal-icon.danger { background: #ff5252; }
    .modal-icon.primary { background: var(--primary-blue); }
    #loader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 0, 90, 0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    .spinner-gold { width: 50px; height: 50px; border: 4px solid rgba(212, 175, 55, 0.2); border-top-color: var(--gold-primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader-overlay"><div class="spinner-gold mb-3"></div><div style="color: var(--gold-light);">กำลังตรวจสอบสิทธิ์...</div></div>

  <div id="lux-modal" class="modal-overlay">
    <div class="modal-card">
      <div id="lux-icon-box" class="modal-icon primary"><i id="lux-icon" class="fas fa-check"></i></div>
      <h3 id="lux-title" style="color: var(--gold-light);">ยินดีต้อนรับ</h3>
      <p id="lux-message" style="color: white; font-size: 1.1rem;"></p>
      <div class="d-flex gap-2 mt-4">
        <button id="lux-cancel" class="btn btn-outline-light flex-grow-1" style="border-radius:30px; display:none;" onclick="closeModal('lux-modal')">ยกเลิก</button>
        <button id="lux-confirm" class="btn btn-login flex-grow-1" style="margin-top:0; border-radius:30px;">ตกลง</button>
      </div>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="logo-container"><img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" alt="Logo"></div>
    <div class="system-title">เจริญกรุงคอนโดมิเนียม 3</div>
    <form id="loginForm" autocomplete="off">
      <div class="mb-3 text-start">
        <label style="color:var(--gold-primary); font-size:0.8rem; margin-left:5px;">USERNAME</label>
        <input type="text" id="userInput" class="form-control form-control-lg" required autocomplete="off" spellcheck="false">
      </div>
      <div class="mb-4 text-start">
        <label style="color:var(--gold-primary); font-size:0.8rem; margin-left:5px;">PASSWORD</label>
        <input type="password" id="passInput" class="form-control form-control-lg" required autocomplete="new-password">
      </div>
      <button type="submit" id="btn-login" class="btn-login">เข้าสู่ระบบ</button>
    </form>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwiXYmpUymZTepreVpuld-eHA1cbGWZ0ErLVtfD9Insvoo3chXwVsMywG3zjMcJFxZtA/exec";
    let modalAction = null;
    let currentUser = null;

    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btn-login');

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      btnLogin.disabled = true;
      document.getElementById('loader-overlay').style.display = 'flex';

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkLogin", username: document.getElementById('userInput').value, password: document.getElementById('passInput').value })
        });
        const result = await res.json();
        document.getElementById('loader-overlay').style.display = 'none';

        if (result.success) {
          currentUser = result;
          localStorage.setItem('ck3_user', JSON.stringify(result));
          showNotice("สำเร็จ", "คุณ " + result.full_name + " เข้าสู่ระบบสำเร็จ", "primary", () => redirectToApp());
        } else {
          showNotice("ไม่สำเร็จ", result.message, "danger");
          btnLogin.disabled = false;
        }
      } catch (err) {
        showNotice("ขัดข้อง", "การเชื่อมต่อเซิร์ฟเวอร์ล้มเหลว", "danger");
        btnLogin.disabled = false;
      }
    };

    function redirectToApp() {
      const role = currentUser.role.toLowerCase();
      if (role === 'admin' || role === 'super_admin') window.location.href = "admin.html";
      else if (role === 'technician') window.location.href = "tech.html";
      else window.location.href = "resident.html";
    }

    function showNotice(title, msg, type, onConfirm = null) {
      const m = document.getElementById('lux-modal');
      document.getElementById('lux-title').innerText = title;
      document.getElementById('lux-message').innerText = msg;
      document.getElementById('lux-icon-box').className = 'modal-icon ' + type;
      document.getElementById('lux-icon').className = 'fas ' + (type === 'danger' ? 'fa-exclamation-triangle' : 'fa-check');
      document.getElementById('lux-cancel').style.display = 'none';
      m.style.display = 'flex';
      setTimeout(() => m.classList.add('show'), 10);
      modalAction = onConfirm;
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.remove('show');
      setTimeout(() => m.style.display = 'none', 300);
    }

    document.getElementById('lux-confirm').onclick = () => { if(modalAction) modalAction(); closeModal('lux-modal'); };

    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('lux-modal');
      if (modal.classList.contains('show')) {
        if (e.key === 'Enter') document.getElementById('lux-confirm').click();
        if (e.key === 'Escape') closeModal('lux-modal');
      }
    });
  </script>
</body>
</html>
