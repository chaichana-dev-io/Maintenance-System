<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งซ่อม | เจริญกรุงคอนโดมิเนียม 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root { --primary-blue: #1800ad; --deep-blue: #0c005a; --gold-primary: #d4af37; --gold-light: #f1e3a0; --glass-bg: rgba(255, 255, 255, 0.1); }
    body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at center, var(--primary-blue) 0%, var(--deep-blue) 100%); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .login-wrapper { width: 100%; max-width: 380px; text-align: center; z-index: 10; }
    .logo-container img { max-width: 250px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); margin-bottom: 20px; }
    .system-title { font-size: 1.5rem; color: var(--gold-light); margin-bottom: 30px; letter-spacing: 1px; }
    .form-control-lg { background: var(--glass-bg); border: 1px solid rgba(212, 175, 55, 0.3); color: white; border-radius: 12px; }
    .form-control-lg:focus { background: rgba(255, 255, 255, 0.15); border-color: var(--gold-primary); color: white; box-shadow: none; }
    .btn-login { background: linear-gradient(135deg, #d4af37 0%, #b8962c 100%); border: none; color: var(--deep-blue); padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; margin-top: 10px; transition: 0.3s; }
    .btn-login:disabled { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }

    /* 💎 Popup Style */
    #welcome-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
    .popup-content { background: linear-gradient(145deg, var(--deep-blue), #1a004d); border: 2px solid var(--gold-primary); border-radius: 30px; padding: 40px; text-align: center; max-width: 350px; width: 90%; transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #welcome-popup.show { opacity: 1; }
    #welcome-popup.show .popup-content { transform: scale(1); }
    .btn-confirm { background: var(--gold-primary); color: var(--deep-blue); border: none; padding: 12px 40px; border-radius: 30px; font-weight: 600; transition: 0.3s; }

    #loader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 0, 90, 0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    .spinner-gold { width: 50px; height: 50px; border: 4px solid rgba(212, 175, 55, 0.2); border-top-color: var(--gold-primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader-overlay"><div class="spinner-gold mb-3"></div><div style="color: var(--gold-light);">กำลังตรวจสอบสิทธิ์...</div></div>

  <div id="welcome-popup">
    <div class="popup-content">
      <img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" width="100" class="mb-3">
      <h3 style="color: var(--gold-light);">ยินดีต้อนรับ</h3>
      <p style="color: white; font-size: 1.2rem;">คุณ <span id="user-display-name"></span></p>
      <p class="text-white-50 mb-4">เข้าสู่ระบบสำเร็จ</p>
      <button class="btn-confirm" id="btn-start" onclick="redirectToApp()">เริ่มต้นใช้งาน</button>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="logo-container"><img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" alt="Logo"></div>
    <div class="system-title">เจริญกรุงคอนโดมิเนียม 3</div>
    
    <form id="loginForm" autocomplete="off">
      <div class="mb-3 text-start">
        <label style="color:var(--gold-primary); font-size:0.8rem; margin-left:5px;">USERNAME</label>
        <input type="text" id="userInput" class="form-control form-control-lg" required autocomplete="off" spellcheck="false">
      </div>
      <div class="mb-4 text-start">
        <label style="color:var(--gold-primary); font-size:0.8rem; margin-left:5px;">PASSWORD</label>
        <input type="password" id="passInput" class="form-control form-control-lg" required autocomplete="new-password">
      </div>
      <button type="submit" id="btn-login" class="btn-login">เข้าสู่ระบบ</button>
    </form>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVbTUxPwRQ3aGKlCAsGUfiSE2KAW7ipSei0U9f3GvjEDPw10FmlMUdHHmyyQNhrRprEQ/exec";
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btn-login');
    let currentUser = null;

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      btnLogin.disabled = true; // 🚫 ป้องกันกดซ้ำ
      btnLogin.innerText = "กำลังตรวจสอบ...";
      document.getElementById('loader-overlay').style.display = 'flex';

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "checkLogin",
            username: document.getElementById('userInput').value,
            password: document.getElementById('passInput').value
          })
        });
        const result = await res.json();

        if (result.success) {
          currentUser = result;
          localStorage.setItem('ck3_user', JSON.stringify(result));
          document.getElementById('user-display-name').innerText = result.full_name;
          document.getElementById('loader-overlay').style.display = 'none';
          
          const popup = document.getElementById('welcome-popup');
          popup.style.display = 'flex';
          setTimeout(() => popup.classList.add('show'), 10);
        } else {
          alert(result.message);
          resetUI();
        }
      } catch (err) {
        alert("การเชื่อมต่อขัดข้อง");
        resetUI();
      }
    };

    function resetUI() {
      document.getElementById('loader-overlay').style.display = 'none';
      btnLogin.disabled = false;
      btnLogin.innerText = "เข้าสู่ระบบ";
    }

    function redirectToApp() {
      const role = currentUser.role.toLowerCase();
      if (role === 'admin' || role === 'super_admin') window.location.href = "admin.html";
      else if (role === 'technician') window.location.href = "tech.html";
      else window.location.href = "resident.html";
    }

    // ⌨️ Keyboard Control (Enter / Esc)
    window.addEventListener('keydown', (e) => {
      const popup = document.getElementById('welcome-popup');
      if (popup.classList.contains('show')) {
        if (e.key === 'Enter') redirectToApp();
        if (e.key === 'Escape') {
          popup.classList.remove('show');
          setTimeout(() => popup.style.display = 'none', 300);
          resetUI();
        }
      }
    });
  </script>
</body>
</html>
