<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK3 | Super Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f4f7f9; }
    .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .role-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
    .bg-super { background: #fee2e2; color: #ef4444; }
    .bg-admin { background: #dbeafe; color: #3b82f6; }
    .bg-tech { background: #fef3c7; color: #d97706; }
    .bg-resident { background: #dcfce7; color: #16a34a; }
    #spinner { display:none; position:fixed; top:50%; left:50%; z-index:9999; }
  </style>
</head>
<body class="p-4">

  <div id="spinner" class="spinner-border text-primary"></div>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3><i class="fas fa-city text-primary me-2"></i>CK3 Super Admin</h3>
      <button class="btn btn-outline-primary" onclick="loadUsers()"><i class="fas fa-sync"></i> รีเฟรช</button>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card card-custom p-4">
          <h5 class="mb-3">เพิ่มผู้ใช้งาน</h5>
          <form id="userForm">
            <select class="form-select mb-3" id="role" onchange="toggleRoom()" required>
              <option value="" disabled selected>เลือกสิทธิ์...</option>
              <option value="admin">Admin (นิติ)</option>
              <option value="technician">Technician (ช่าง)</option>
              <option value="resident">Resident (ลูกบ้าน)</option>
            </select>
            <input type="text" class="form-control mb-3" id="roomNumber" placeholder="เลขห้อง (เช่น 101)" style="display:none">
            <input type="text" class="form-control mb-3" id="username" placeholder="Username" required>
            <input type="text" class="form-control mb-3" id="fullName" placeholder="ชื่อ-นามสกุล" required>
            <input type="text" class="form-control mb-3" id="phone" placeholder="เบอร์โทร">
            <button type="submit" class="btn btn-primary w-100" id="btnSave">บันทึก</button>
          </form>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card card-custom p-4">
          <input type="text" id="search" class="form-control mb-3" placeholder="ค้นหา..." onkeyup="filterTable()">
          <div class="table-responsive">
            <table class="table align-middle" id="userTable">
              <thead><tr><th>ID</th><th>ชื่อ</th><th>สิทธิ์</th><th>จัดการ</th></tr></thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5P1hOqWT2sv7Ja3C7V2_C4lcYw4--t1I-Z9lXFJvlRPjPpLlooZcDrduMfJEOF5Yy0Q/exec";

    function toggleRoom() {
      document.getElementById('roomNumber').style.display = (document.getElementById('role').value === 'resident') ? 'block' : 'none';
    }

    async function api(data) {
      document.getElementById('spinner').style.display = 'block';
      const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) });
      document.getElementById('spinner').style.display = 'none';
      return await res.json();
    }

    async function loadUsers() {
      const res = await api({ action: 'fetchUsers' });
      const html = res.users.map(u => {
        const isSA = u[5] === 'super_admin';
        const badgeClass = u[5] === 'super_admin' ? 'bg-super' : u[5] === 'admin' ? 'bg-admin' : u[5] === 'technician' ? 'bg-tech' : 'bg-resident';
        return `<tr>
          <td><strong>${u[0]}</strong></td>
          <td>${u[3]}</td>
          <td><span class="role-badge ${badgeClass}">${u[5]}</span></td>
          <td>
            ${isSA ? '<i class="fas fa-lock text-muted"></i>' : 
            `<button class="btn btn-sm btn-outline-danger" onclick="resetPw('${u[0]}','${u[5]}')">Reset</button>`}
          </td>
        </tr>`;
      }).join('');
      document.getElementById('userTableBody').innerHTML = html;
    }

    async function resetPw(id, role) {
      const pw = (role === 'resident') ? '@Abc1234' : 'Abc@1234';
      if(confirm(`รีเซ็ต ${id} เป็น: ${pw}?`)) {
        const res = await api({ action: 'resetPassword', userId: id });
        alert(res.message);
        loadUsers();
      }
    }

    document.getElementById('userForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await api({
        action: 'createUser',
        role: document.getElementById('role').value,
        roomNumber: document.getElementById('roomNumber').value,
        username: document.getElementById('username').value,
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value
      });
      if(res.success) { alert("สำเร็จ! ID: " + res.newId); loadUsers(); e.target.reset(); toggleRoom(); }
    };

    function filterTable() {
      let val = document.getElementById('search').value.toLowerCase();
      let rows = document.querySelectorAll('#userTableBody tr');
      rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none');
    }

    window.onload = loadUsers;
  </script>
</body>
</html>
