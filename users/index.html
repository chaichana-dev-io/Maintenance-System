<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้งาน | เจริญกรุงคอนโด 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    const userData = JSON.parse(localStorage.getItem('ck3_user'));
    if (!userData || (userData.role.toLowerCase() === 'resident' || userData.role.toLowerCase() === 'technician')) window.location.href = "../index.html";
    const ROLE = userData.role.toLowerCase();
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwiXYmpUymZTepreVpuld-eHA1cbGWZ0ErLVtfD9Insvoo3chXwVsMywG3zjMcJFxZtA/exec";
  </script>
  <style>
    :root { --primary-blue: #1800ad; --deep-blue: #0c005a; --gold-primary: #d4af37; --gold-light: #f1e3a0; --sidebar-width: 280px; }
    body { font-family: 'Prompt', sans-serif; background-color: #f4f7f6; margin: 0; }
    #sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, var(--deep-blue) 0%, var(--primary-blue) 100%); color: white; position: fixed; height: 100vh; padding: 30px 15px; z-index: 1000; }
    .sidebar-brand { text-align: center; margin-bottom: 40px; }
    .sidebar-brand img { max-width: 140px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
    .logo-text { color: var(--gold-light); font-size: 1.1rem; margin-top: 10px; }
    .nav-item { padding: 14px 20px; color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; border-radius: 15px; margin-bottom: 8px; transition: 0.3s; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.1); color: var(--gold-light); text-decoration: none; }
    .nav-item.active { background: var(--gold-primary); color: var(--deep-blue); font-weight: 600; }
    #main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; display: flex; flex-direction: column; }
    .table-container { background: white; border-radius: 25px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .btn-action { width: 38px; height: 38px; border-radius: 12px; border: none; margin: 2px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 0, 90, 0.7); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
    .modal-overlay.show { opacity: 1; display: flex; }
    .modal-card { background: white; width: 95%; max-width: 480px; padding: 35px; border-radius: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); transform: scale(0.8); transition: 0.3s; }
    .modal-overlay.show .modal-card { transform: scale(1); }
    .form-control { border-radius: 12px; padding: 12px 15px; border: 1px solid #eee; background: #f9f9f9; margin-bottom: 15px; }
    .modal-icon { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; }
    .modal-icon.danger { background: #ff5252; }
    .modal-icon.primary { background: var(--primary-blue); }
    .footer { text-align: center; padding: 25px 0 10px 0; color: rgba(0,0,0,0.4); font-size: 0.85rem; margin-top: auto; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-brand"><img src="https://img1.pic.in.th/images/logo310c09ae65f63ac1d.png" alt="Logo"><div class="logo-text">ระบบแจ้งซ่อม</div></div>
    <nav>
      <a href="../admin.html" class="nav-item"><i class="fas fa-th-large me-2"></i> แดชบอร์ด</a>
      <a href="../repairs/" class="nav-item"><i class="fas fa-tools me-2"></i> งานแจ้งซ่อม</a>
      <a href="./" class="nav-item active"><i class="fas fa-users-cog me-2"></i> จัดการผู้ใช้</a>
      <a href="../profile/" class="nav-item"><i class="fas fa-user-circle me-2"></i> ข้อมูลส่วนตัว</a>
      <hr style="border-color: rgba(212,175,55,0.2); margin: 20px 0;"><div class="nav-item text-warning" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</div>
    </nav>
  </aside>

  <main id="main-content">
    <div class="content-wrapper">
      <header class="header-top d-flex justify-content-between align-items-center mb-4">
        <div><h2 style="color: var(--deep-blue); font-weight: 600; margin: 0;">จัดการผู้ใช้งาน</h2><p class="text-muted mb-0">เจริญกรุงคอนโด อาคาร 3</p></div>
        <div class="admin-profile"><i class="fas fa-user-shield me-2 text-primary"></i> <span id="admin-role-name"></span></div>
      </header>
      <div class="d-flex justify-content-end mb-4"><button class="btn btn-primary px-4 py-2 border-0 shadow-sm" style="border-radius:12px; background: var(--primary-blue);" onclick="openModal('add-user-modal')"><i class="fas fa-plus me-2"></i> เพิ่มผู้ใช้ใหม่</button></div>
      <div class="table-container"><table class="table align-middle"><thead><tr class="text-muted"><th>ID</th><th>Username</th><th>ชื่อ-นามสกุล</th><th>บทบาท</th><th class="text-center">จัดการ</th></tr></thead><tbody id="user-table-body"><tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr></tbody></table></div>
    </div>
    <footer class="footer">© 2026 Charoen Krung Condominium 3 | บริหารจัดการโดยนิติบุคคล</footer>
  </main>

  <div id="lux-modal" class="modal-overlay">
    <div class="modal-card text-center" style="max-width: 400px;">
      <div id="lux-icon-box" class="modal-icon primary"><i id="lux-icon" class="fas fa-check"></i></div>
      <h4 id="lux-title" class="fw-bold"></h4>
      <p id="lux-message" class="text-muted mb-4"></p>
      <button id="lux-confirm" class="btn btn-primary w-100 border-0" style="border-radius:12px; background: var(--primary-blue);">ตกลง</button>
    </div>
  </div>

  <script>
    let modalAction = null;
    document.getElementById('admin-role-name').innerText = ROLE.toUpperCase();
    
    async function fetchUsers() {
      const tbody = document.getElementById('user-table-body');
      try {
        const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "fetchUsers", callerRole: ROLE }) });
        const r = await res.json();
        if (r.success) {
          tbody.innerHTML = '';
          r.users.forEach(u => {
            let btns = `<button class="btn-action" style="background:#e3f2fd;color:#1976d2" onclick="editU('${u[0]}')"><i class="fas fa-pen"></i></button>`;
            btns += `<button class="btn-action" style="background:#ffebee;color:#d32f2f" onclick="deleteU('${u[0]}')"><i class="fas fa-trash"></i></button>`;
            tbody.innerHTML += `<tr><td>${u[0]}</td><td><strong>${u[1]}</strong></td><td>${u[3]}</td><td><span class="badge ${u[5]==='resident'?'bg-info text-dark':'bg-dark'} px-3">${u[5]}</span></td><td class="text-center">${btns}</td></tr>`;
          });
        }
      } catch (e) { tbody.innerHTML = '<tr><td colspan="5">Error</td></tr>'; }
    }

    function showNotice(title, msg, type) {
      const m = document.getElementById('lux-modal');
      document.getElementById('lux-title').innerText = title;
      document.getElementById('lux-message').innerText = msg;
      document.getElementById('lux-icon-box').className = 'modal-icon ' + type;
      m.style.display = 'flex';
      setTimeout(() => m.classList.add('show'), 10);
    }

    document.getElementById('lux-confirm').onclick = () => {
      document.getElementById('lux-modal').classList.remove('show');
      setTimeout(() => document.getElementById('lux-modal').style.display = 'none', 300);
    };

    function logout() { localStorage.removeItem('ck3_user'); window.location.href = "../index.html"; }
    fetchUsers();
  </script>
</body>
</html>
